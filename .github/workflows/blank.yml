name: Build Custom ROM - Samsung A10

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      ROM_DIR: ${{ github.workspace }}/rom
      DEVICE: a10
      BUILD_TARGET: lineage_a10-userdebug

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            adb \
            aria2 \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses6 \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses6 \
            libncurses-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Install repo
        run: |
          mkdir -p "$HOME/bin"
          curl https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize LineageOS
        run: |
          mkdir -p "$ROM_DIR"
          cd "$ROM_DIR"

          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-21.0 \
            --git-lfs

      - name: Add Samsung A10 manifest
        run: |
          cd "$ROM_DIR"
          mkdir -p .repo/local_manifests

          cat > .repo/local_manifests/a10.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>

            <remote
              name="a10"
              fetch="https://github.com/"
              revision="14.0" />

            <project
              name="crdroidandroid/android_device_samsung_a10"
              path="device/samsung/a10"
              remote="a10" />

          </manifest>
          EOF

          cat .repo/local_manifests/a10.xml

      - name: Sync source
        run: |
          cd "$ROM_DIR"

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -c \
            -j2

      - name: Check device tree
        run: |
          cd "$ROM_DIR"

          echo "Checking device tree..."
          test -f device/samsung/a10/AndroidProducts.mk
          test -f device/samsung/a10/BoardConfig.mk

          echo "Device tree found:"
          ls -la device/samsung/a10

      - name: Setup build environment
        run: |
          cd "$ROM_DIR"

          source build/envsetup.sh

          echo "Available A10 targets:"
          lunch --help || true

      - name: Build ROM
        run: |
          cd "$ROM_DIR"

          source build/envsetup.sh

          lunch "$BUILD_TARGET"

          mka bacon

      - name: Find ROM files
        if: success()
        run: |
          cd "$ROM_DIR"

          echo "ROM output:"
          find out/target/product/a10 \
            -maxdepth 1 \
            -type f \
            \( -name "*.zip" -o -name "*.img" \) \
            -print

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-A10-ROM
          path: |
            rom/out/target/product/a10/*.zip
            rom/out/target/product/a10/*.img
    
