name: Build Custom ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Maximize Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev repo

    - name: Initialize LineageOS Source
      run: |
        mkdir -p ~/rom
        cd ~/rom
        git config --global user.name "saqibansari12054-jpg"
        git config --global user.email "saqibansari12054@gmail.com"
        repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1

    - name: Clone Device Trees (Samsung A10)
      run: |
        cd ~/rom
        git clone https://github.com/eun-01/android_device_samsung_a10.git -b lineage-20.0 device/samsung/a10 --depth=1
        git clone https://github.com/eun-01/android_device_samsung_exynos7884-common.git -b lineage-20.0 device/samsung/exynos7884-common --depth=1 || true
        git clone https://github.com/eun-01/android_kernel_samsung_exynos7884.git -b lineage-20.0 kernel/samsung/exynos7884 --depth=1 || true
        git clone https://github.com/eun-01/android_vendor_samsung_a10.git -b lineage-20.0 vendor/samsung/a10 --depth=1 || true

    - name: Sync Sources
      run: |
        cd ~/rom
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Build ROM
      run: |
        cd ~/rom
        source build/envsetup.sh
        lunch lineage_a10-userdebug
        mka bacon -j$(nproc --all)
