name: Build Custom ROM

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Maximize Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
        sudo apt-get clean
        docker image prune -a -f

    - name: Setup Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils lzop pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev repo

    - name: Initialize LineageOS Source
      run: |
        mkdir -p ~/rom
        cd ~/rom
        git config --global user.name "saqibansari12054-jpg"
        git config --global user.email "saqibansari12054@gmail.com"
        repo init -u https://github.com/LineageOS/android.git -b lineage-20.0 --git-lfs --depth=1

    - name: Setup Local Manifest for Samsung A10
      run: |
        cd ~/rom
        mkdir -p .repo/local_manifests
        git clone https://github.com/eun-01/android_device_samsung_a10.git -b lineage-20.0 .repo/local_manifests || true

    - name: Fast Sync Sources (Shallow Clone)
      run: |
        cd ~/rom
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --current-branch

    - name: Build ROM
      run: |
        cd ~/rom
        source build/envsetup.sh
        lunch lineage_a10-userdebug || lunch lineage_a10-ap1a-userdebug
        mka bacon -j$(nproc --all)
