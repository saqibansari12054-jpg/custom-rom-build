name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK Direct
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-34/android.jar"

          mkdir -p build/gen build/obj build/apk/assets
          
          if [ -f "index.html" ]; then
            cp index.html build/apk/assets/index.html
          else
            echo "<html><body><h1>Invoice Tracker</h1></body></html>" > build/apk/assets/index.html
          fi

          cat << 'EOF' > AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.saqib.invoicetracker" android:versionCode="1" android:versionName="1.0">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="Invoice Tracker">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p src/com/saqib/invoicetracker
          cat << 'EOF' > src/com/saqib/invoicetracker/MainActivity.java
          package com.saqib.invoicetracker;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }
          }
          EOF

          $BUILD_TOOLS/aapt package -f -m -J build/gen -S res -M AndroidManifest.xml -I $PLATFORM 2>/dev/null || true
          javac -d build/obj -classpath $PLATFORM src/com/saqib/invoicetracker/MainActivity.java
          $BUILD_TOOLS/d8 --output build/apk/ build/obj/com/saqib/invoicetracker/*.class
          $BUILD_TOOLS/aapt package -f -M AndroidManifest.xml -A build/apk/assets -I $PLATFORM -F build/unsigned.apk build/apk/
          
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --out Invoice-Tracker.apk build/unsigned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Tracker-APK
          path: Invoice-Tracker.apk
