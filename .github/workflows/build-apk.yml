name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Web App to APK
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/index.html
          else
            echo "<html><body><h1>Invoice Tracker</h1></body></html>" > www/index.html
          fi
          
          # Install Cordova CLI locally for compatibility
          npm init -y
          npm install cordova@latest
          npx cordova create app com.saqib.invoicetracker "Invoice Tracker"
          cp www/index.html app/www/index.html
          cd app
          npx cordova platform add android@12.0.0
          npx cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Tracker-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
