name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Install Cordova
        run: |
          npm install --global cordova@latest

      - name: Install project dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          fi

      - name: Check web files
        run: |
          echo "Checking web application files..."

          if [ -f "www/index.html" ]; then
            echo "Found: www/index.html"
          elif [ -f "index.html" ]; then
            echo "Found: index.html"
          else
            echo "ERROR: index.html was not found."
            echo "Put your website files in the www/ folder."
            exit 1
          fi

      - name: Create clean Cordova project
        run: |
          rm -rf build
          mkdir -p build

          cordova create build \
            com.saqib.invoicetracker \
            "Invoice Tracker"

      - name: Copy web application
        run: |
          rm -rf build/www/*
          mkdir -p build/www

          if [ -d "www" ] && [ -f "www/index.html" ]; then
            echo "Copying www/ into Cordova project..."
            cp -R www/. build/www/
          else
            echo "Copying index.html..."
            cp index.html build/www/index.html
          fi

      - name: Add Android platform
        working-directory: build
        run: |
          cordova platform add android@latest

      - name: Build APK
        working-directory: build
        run: |
          cordova requirements
          cordova build android --debug

      - name: Find APK
        run: |
          echo "Searching for APK..."

          find build/platforms/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Invoice-Tracker-APK
          path: |
            build/platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
